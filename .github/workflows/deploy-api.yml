name: Deploy API to Azure

on:
  push:
    branches: [master]
    paths:
      - 'api-vastrika/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore api-vastrika/HouseOfVastrikaa.API/HouseOfVastrikaa.API.csproj

      - name: Build
        run: dotnet build api-vastrika/HouseOfVastrikaa.API/HouseOfVastrikaa.API.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish api-vastrika/HouseOfVastrikaa.API/HouseOfVastrikaa.API.csproj --configuration Release --output ./publish --no-build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish
